  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {%- if page.full_title %}
    {%- assign page_title = page.full_title %}
  {%- else %}
    {%- assign page_title = page.title | append: " | " | append: site.title %}
  {%- endif %}

  <!-- 基本SEO（タイトル・説明文は各ページの front matter の title / description） -->
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- ファビコン・テーマカラー -->
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#05070d">

  <!-- OGP（SNSでシェアされた時の表示） -->
  <meta property="og:type" content="{% if is_home %}website{% else %}article{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/ogp.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.title }}">
  <meta property="og:locale" content="ja_JP">

  <!-- X（旧Twitter） -->
  <meta name="twitter:card" content="summary_large_image">
  {%- if is_home %}

  <!-- 構造化データ（検索エンジン向け） -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ site.title | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "description": {{ page.schema_description | jsonify }},
    "inLanguage": "ja"
  }
  </script>
  {%- endif %}

  <!-- アニメーションのオン／オフ：保存した設定を表示前に反映する（切り替えは assets/js/main.js の initMotionToggle） -->
  <script>try{if(localStorage.getItem("exastro-motion")==="off")document.documentElement.classList.add("is-motion-off")}catch(e){}</script>

  <!-- ページ専用の CSS（front matter の css）は style.css と sections.css の間に読み込む -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- for css in page.css %}
  <link rel="stylesheet" href="{{ css | relative_url }}">
  {%- endfor %}
  <link rel="stylesheet" href="{{ '/assets/css/sections.css' | relative_url }}">
