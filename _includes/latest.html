        <!-- 最新ニュース（assets/css/sections.css）。内容は _data/news.yml で書き換える -->
        {%- assign release = site.data.news.release %}
        <div class="latest">
          <article class="latest__release">
            <p class="latest__label"><span class="latest__live" aria-hidden="true"></span>Latest Release</p>
            <h4 class="latest__title">{{ release.product }} <span class="latest__version">{{ release.version }}</span><!-- リリース--></h4>
            <p class="latest__date"><time datetime="{{ release.date | date: '%Y-%m-%d' }}">{{ release.date | date: '%Y.%m.%d' }}</time></p>
            <ul class="latest__links">
              <li>
                <a class="latest__button latest__button--primary" href="{{ release.notes_url }}" target="_blank" rel="noopener">リリースノート<span class="latest__arrow" aria-hidden="true"></span></a>
              </li>
              <li>
                <a class="latest__button" href="{{ release.github_url }}" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>GitHub<span class="latest__arrow" aria-hidden="true"></span>
                </a>
              </li>
            </ul>
          </article>

          <!-- 記事・ニュースへのリンク（_data/news.yml の items を足すだけで増やせる） -->
