  <!-- スクロール位置のメモリ（目盛りは assets/js/main.js で生成） -->
  <div class="scroll-meter" aria-hidden="true">
    <div class="scroll-meter__track"><div class="scroll-meter__fill"></div></div>
    <div class="scroll-meter__ticks"></div>
    <div class="scroll-meter__current">0%</div>
  </div>

  <!-- メモリの上下：前後のセクションへ移動するボタン（assets/js/main.js） -->
  <button class="scroll-step scroll-step--prev" type="button" aria-label="前のセクションへ" title="前のセクションへ"></button>
  <button class="scroll-step scroll-step--next" type="button" aria-label="次のセクションへ" title="次のセクションへ"></button>
