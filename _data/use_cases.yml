# 利用シーン（トップページと /use-cases/ に表示。_includes/use-cases.html）
# 上から順に表示する。tag を書くとタイトルの前にラベルが付く
# url を書かない（またはコメントアウトする）と「詳細はこちら」は表示しない
# image はサムネイル（960×540）、image_large はクリックで拡大したときの画像（1920×1080）。
- title: AI×システム運用作業
  text: 担当者が自然言語で依頼すると、AIが手順を組み立て、Exastroが統制して実行します。
  image: /assets/images/use-cases/ai-manual.png
  image_large: /assets/images/use-cases/ai-manual_large.png
  # url: "#" # サイト内のページは /use-cases/xxx/ のように / から書く
- title: システム障害の事象分析と復旧
  text: 監視ツールのアラートなどを受け取り、既知の事象には登録済みの対処を自動で実行します。
  image: /assets/images/use-cases/event.png
  image_large: /assets/images/use-cases/event_large.png
  # url: "#"
- title: IaCに対するCI/CDの実現
  text: GitリポジトリのIaCの更新をきっかけに、構築・テストを自動で実行します。
  image: /assets/images/use-cases/cicd-iac.png
  image_large: /assets/images/use-cases/cicd-iac_large.png
  # url: "#"
- title: アプリケーションに対するCI/CDの実現
  text: アプリのビルド・リリースのパイプラインから呼び出し、環境の構築やデプロイを実行します。
  image: /assets/images/use-cases/cicd-app.png
  image_large: /assets/images/use-cases/cicd-app_large.png
  # url: "#"
- title: Legacyシステムインフラ構築
  tag: シンプルモード
  text: Exastroの設定を意識せずにウィザード型インターフェースでサーバ構築を自動化します。
  image: /assets/images/use-cases/legacy.png
  image_large: /assets/images/use-cases/legacy_large.png
  url: "https://ita.exastro.org/simple_mode.html"
