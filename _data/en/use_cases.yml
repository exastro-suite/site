- title: Incident analysis and recovery
  text: Exastro receives alerts from monitoring tools and runs registered responses automatically for known events.
  image: /assets/images/use-cases/event.png
  image_large: /assets/images/use-cases/event_large.png
  # url: "#"
- title: CI/CD for IaC
  text: When IaC in a Git repository is updated, Exastro runs builds and tests automatically.
  image: /assets/images/use-cases/cicd-iac.png
  image_large: /assets/images/use-cases/cicd-iac_large.png
  # url: "#"
- title: CI/CD for applications
  text: Called from an application build and release pipeline, Exastro runs environment setup and deployment.
  image: /assets/images/use-cases/cicd-app.png
  image_large: /assets/images/use-cases/cicd-app_large.png
  # url: "#"
