# 英語版（日本語版は _data/messages.yml）
# 開発者メッセージ（トップページ・/message/ のカードと、記事ページの著者表示に使う）
# 上から順に表示する。featured: true の1件はカードではなく大きく表示する（summary が本文の抜粋）
# url：記事ページ（message/<id>.md）は /message/<id>.html、まだ移植していないものはリニューアル前のサイトの URL
# url を書かないとカードはリンクにならない。name を書かないと名前は出さない
# class を書くとカード（li.message__item）にクラスを足す（coming soon の見た目の調整などに使う）
# 写真：featured は 960×720、それ以外は 640×480
- id: exastro
  featured: true
  title: My Dream for Exastro
  product: Exastro
  catch: Our core ideas stay the same. With AI, they gain new possibilities
  name: Koichi Yoshida
  position: Senior Manager, Infrastructure System Integration and Service Department, NEC Corporation
  photo: /assets/images/message/message-yoshida.jpg
  url: /en/message/exastro.html
  summary:
    - What happens when the work keeps growing but there are not enough people? The engineers who are already there will have to carry the extra load, and it is easy to see that they will become exhausted. And when young people see these experienced engineers, will they really think, "I want to be a system engineer too"?
    - I want to create a smart way of working that anyone would call cool. I want to build a world where engineers can use their knowledge and creativity to create new value, instead of spending their days on routine tasks. That is the starting point for all our work on Exastro.

