# Assets ページ（/assets/）のロゴ一覧。上から順に表示する
# id：ロゴのフォルダ（assets/logo/<id>/）とページ内リンクの id（asset-<id>）、nav：ページ内リンクに出す短い名前
# file：ファイル名から拡張子と -rgb を除いたもの。PNG・SVG は <file>-rgb、EPS は <file>-cmyk.eps
# eps：EPS のファイル名が上の決まりと違うときに書く
# white: true は白抜きのロゴ（暗い背景で表示する）

- id: exastro
  nav: Exastro
  title: Exastro
  groups:
    - title: Logomark & Logotype
      logos:
        - file: Exastro-logo1
        - file: Exastro-logo2
        - file: Exastro-logo1-white
          white: true
        - file: Exastro-logo2-white
          white: true
    - title: Logomark
      logos:
        - file: Exastro-logomark1
        - file: Exastro-logomark2
        - file: Exastro-logomark1-white
          white: true
        - file: Exastro-logomark2-white
          white: true
    - title: Logotype
      logos:
        - file: Exastro-logotype
        - file: Exastro-logotype-white
          white: true

