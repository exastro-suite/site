# 開発者メッセージ（トップページ・/message/ のカードと、記事ページの著者表示に使う）
# 上から順に表示する。featured: true の1件はカードではなく大きく表示する（summary が本文の抜粋）
# url：記事ページ（message/<id>.md）は /message/<id>.html、まだ移植していないものはリニューアル前のサイトの URL
# url を書かないとカードはリンクにならない。name を書かないと名前は出さない
# class を書くとカード（li.message__item）にクラスを足す（coming soon の見た目の調整などに使う）
# 写真：featured は 960×720、それ以外は 640×480
- id: exastro
  featured: true
  title: Exastroにかける夢
  product: Exastro
  catch: ――変わらない思想が、AIによって新しい可能性を手にする。
  name: 吉田 功一
  position: 日本電気株式会社 プラットフォームＳＩサービス統括部 シニアマネージャー
  photo: /assets/images/message/message-yoshida.jpg
  url: /message/exastro.html
  summary:
    - 業務が増え続けるのに、人材が不足すれば何が起こるでしょうか。今いるエンジニアに負担が集中し、疲弊していくことは目に見えています。そして、そんな先輩たちの姿を見た若い人たちは、果たして「自分もシステムエンジニアになりたい」と思うでしょうか。
    - 誰が見てもかっこいいと思える、スマートな働き方を実現したい。そして、エンジニアが日々の作業に追われるのではなく、知恵と創造力を発揮し、新しい価値を生み出すことに力を注げる世界をつくりたい。それが、Exastroを開発してきた原点です。

